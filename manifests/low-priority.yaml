apiVersion: apps/v1
kind: Deployment
metadata:
  name: low-priority-workers
  namespace: preemption-demo
  labels:
    app: low-priority-workers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: low-priority-workers
  template:
    metadata:
      labels:
        app: low-priority-workers
    spec:
      priorityClassName: demo-low
      nodeSelector:
        demo-preemption: "true"
      terminationGracePeriodSeconds: 5
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 700m
              memory: 128Mi
